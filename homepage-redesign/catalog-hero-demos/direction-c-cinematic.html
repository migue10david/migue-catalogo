<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dirección C — Inmersión Cinematográfica</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f9ff;
    --fg: #0b1c30;
    --primary: #091426;
    --secondary: #006a61;
    --surface: #e5eeff;
    --outline: #75777d;
    --muted: #6b7280;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1c30;
      --fg: #e2e8f0;
      --primary: #bcc7de;
      --secondary: #6bd8cb;
      --surface: #213145;
      --outline: #75777d;
      --muted: #94a3b8;
    }
  }

  body {
    font-family: system-ui, -apple-system, 'Inter', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .hero {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
  }

  /* Cinematic background — full viewport, minimal overlay */
  .hero-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .hero-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.9) contrast(1.05);
  }

  .hero-bg .fallback {
    width: 100%;
    height: 100%;
    background:
      radial-gradient(ellipse 100% 80% at 20% 30%, hsl(175 100% 21% / 0.3), transparent 60%),
      radial-gradient(ellipse 80% 100% at 80% 70%, hsl(213 62% 9% / 0.15), transparent 50%),
      var(--surface);
  }

  /* Vignette overlay — subtle, cinematic */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse 60% 50% at 50% 40%, transparent 30%, hsl(0 0% 0% / 0.4) 100%);
    pointer-events: none;
  }

  @media (prefers-color-scheme: dark) {
    .vignette {
      background:
        radial-gradient(ellipse 60% 50% at 50% 40%, transparent 25%, hsl(0 0% 0% / 0.6) 100%);
    }
  }

  .hero-gradient {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(to bottom, transparent 45%, var(--bg) 100%);
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 2rem 2rem 5rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.875rem;
    color: hsl(0 0% 100% / 0.7);
    text-decoration: none;
    margin-bottom: 2.5rem;
    transition: all 0.2s;
    text-shadow: 0 1px 8px hsl(0 0% 0% / 0.3);
  }

  @media (prefers-color-scheme: light) {
    .back-link {
      color: hsl(0 0% 100% / 0.8);
    }
  }

  .back-link:hover { color: #fff; }
  .back-link svg { transition: transform 0.2s; }
  .back-link:hover svg { transform: translateX(-4px); }

  .hero-layout {
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  @media (min-width: 1024px) {
    .hero-layout {
      flex-direction: row;
      align-items: flex-end;
      justify-content: space-between;
      gap: 4rem;
    }
  }

  .hero-text {
    flex: 1;
    max-width: 780px;
  }

  .hero-meta-strip {
    display: flex;
    align-items: center;
    gap: 1rem 1.5rem;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }

  .category-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.375rem 1rem;
    border-radius: 999px;
    background: hsl(0 0% 100% / 0.15);
    backdrop-filter: blur(12px);
    color: #fff;
    border: 1px solid hsl(0 0% 100% / 0.2);
  }

  @media (prefers-color-scheme: dark) {
    .category-badge {
      background: hsl(0 0% 0% / 0.3);
      border-color: hsl(255 255% 255% / 0.1);
    }
  }

  .hero-location {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    font-size: 0.85rem;
    color: hsl(0 0% 100% / 0.7);
    text-shadow: 0 1px 8px hsl(0 0% 0% / 0.3);
  }

  .hero-location svg {
    width: 15px;
    height: 15px;
  }

  .hero-name {
    font-family: 'DM Serif Display', Georgia, 'Times New Roman', serif;
    font-size: clamp(3rem, 9vw, 6.5rem);
    font-weight: 400;
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: #fff;
    text-shadow: 0 2px 24px hsl(0 0% 0% / 0.25);
    margin-bottom: 1.25rem;
  }

  .hero-desc {
    font-size: 1.125rem;
    line-height: 1.7;
    color: hsl(0 0% 100% / 0.8);
    max-width: 520px;
    text-shadow: 0 1px 12px hsl(0 0% 0% / 0.2);
  }

  @media (min-width: 768px) {
    .hero-desc { font-size: 1.25rem; }
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1rem;
    margin-top: 2rem;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.75rem;
    background: var(--secondary);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 999px;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 20px hsl(175 100% 21% / 0.35);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px hsl(175 100% 21% / 0.45);
  }

  @media (prefers-color-scheme: dark) {
    .btn-primary {
      box-shadow: 0 4px 20px hsl(0 0% 0% / 0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 8px 32px hsl(0 0% 0% / 0.4);
    }
  }

  .social-reveal {
    display: flex;
    gap: 0.375rem;
    opacity: 0.6;
    transition: opacity 0.3s;
  }

  .hero-actions:hover .social-reveal {
    opacity: 1;
  }

  .social-reveal a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    color: hsl(0 0% 100% / 0.7);
    text-decoration: none;
    transition: all 0.25s;
  }

  .social-reveal a:hover {
    color: #fff;
    background: hsl(0 0% 100% / 0.1);
    transform: translateY(-2px);
  }

  .social-reveal svg {
    width: 20px;
    height: 20px;
  }

  /* Logo + phone floating */
  .hero-aside {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1rem;
  }

  .phone-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1.25rem 0.5rem 1rem;
    border-radius: 999px;
    background: hsl(0 0% 100% / 0.12);
    backdrop-filter: blur(12px);
    border: 1px solid hsl(0 0% 100% / 0.15);
    color: #fff;
    font-size: 0.85rem;
    text-decoration: none;
    transition: all 0.3s;
  }

  .phone-badge:hover {
    background: hsl(0 0% 100% / 0.2);
    transform: translateY(-2px);
  }

  .phone-badge svg {
    width: 16px;
    height: 16px;
  }

  .logo-frame {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid hsl(0 0% 100% / 0.25);
    background: hsl(0 0% 0% / 0.3);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px hsl(0 0% 0% / 0.3);
  }

  .logo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .logo-frame svg {
    width: 34px;
    height: 34px;
    color: hsl(0 0% 100% / 0.5);
  }

  /* Scroll indicator */
  .scroll-indicator {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    color: hsl(0 0% 100% / 0.4);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .scroll-indicator .mouse {
    width: 20px;
    height: 32px;
    border: 2px solid hsl(0 0% 100% / 0.35);
    border-radius: 10px;
    position: relative;
  }

  .scroll-indicator .mouse::after {
    content: '';
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 8px;
    background: hsl(0 0% 100% / 0.5);
    border-radius: 2px;
    animation: scroll-wheel 2s ease-in-out infinite;
  }

  @keyframes scroll-wheel {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 1; }
    50% { transform: translateX(-50%) translateY(6px); opacity: 0.3; }
  }

  /* Light mode: override white text to dark text on the light hero */
  @media (prefers-color-scheme: light) {
    .hero-name {
      color: var(--primary);
      text-shadow: 0 2px 24px hsl(0 0% 100% / 0.5);
    }
    .hero-desc { color: var(--muted); text-shadow: none; }
    .hero-location { color: var(--muted); text-shadow: none; }
    .category-badge {
      background: var(--surface);
      color: var(--primary);
      border-color: var(--outline);
      backdrop-filter: none;
    }
    .social-reveal a { color: var(--muted); }
    .social-reveal a:hover { color: var(--fg); background: var(--surface); }
    .phone-badge {
      background: var(--surface);
      border-color: var(--outline);
      color: var(--fg);
      backdrop-filter: none;
    }
    .phone-badge:hover { background: var(--card-bg, #fff); }
    .logo-frame {
      background: hsl(0 0% 100% / 0.85);
      border-color: var(--outline);
      backdrop-filter: none;
    }
    .logo-frame svg { color: var(--muted); }
    .back-link { color: var(--muted); text-shadow: none; }
    .back-link:hover { color: var(--fg); }
    .btn-primary {
      box-shadow: 0 4px 20px hsl(175 100% 21% / 0.3);
    }
    .vignette {
      background:
        radial-gradient(ellipse 60% 50% at 50% 40%, transparent 40%, hsl(0 0% 0% / 0.15) 100%);
    }
  }

  /* Animations */
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes scale-in {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .animate { animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .scale-in { animation: scale-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .delay-1 { animation-delay: 0.15s; }
  .delay-2 { animation-delay: 0.3s; }
  .delay-3 { animation-delay: 0.45s; }
  .delay-4 { animation-delay: 0.6s; }
  .delay-5 { animation-delay: 0.75s; }

  .label {
    position: fixed;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    background: var(--surface);
    padding: 0.375rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--outline);
  }

  @media (prefers-color-scheme: dark) {
    .label {
      background: #1e293b;
      border-color: #334155;
    }
  }
</style>
</head>
<body>
<div class="label">Dirección C · Inmersión Cinematográfica</div>

<section class="hero">
  <div class="hero-bg">
    <div class="fallback"></div>
  </div>
  <div class="vignette"></div>
  <div class="hero-gradient"></div>

  <div class="hero-content">
    <a href="#" class="back-link animate">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Volver al inicio
    </a>

    <div class="hero-layout">
      <div class="hero-text">
        <div class="hero-meta-strip animate delay-1">
          <span class="category-badge">Moda</span>
          <span class="hero-location">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            Córdoba, Argentina
          </span>
        </div>

        <h1 class="hero-name animate delay-2">Elena Studio</h1>
        <p class="hero-desc animate delay-3">
          Descubrí una curada selección de prendas esenciales, diseñadas para la mujer que valora la calidad, el confort y la atemporalidad.
        </p>

        <div class="hero-actions animate delay-4">
          <a href="#" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            Explorar productos
          </a>
          <div class="social-reveal">
            <a href="#" title="Instagram">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>
            </a>
            <a href="#" title="Facebook">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3V2Z"/></svg>
            </a>
            <a href="#" title="WhatsApp">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-12.88 7.22L3 21l2.28-5.14A8.5 8.5 0 1 1 21 11.5Z"/></svg>
            </a>
          </div>
        </div>
      </div>

      <div class="hero-aside animate delay-3">
        <a href="#" class="phone-badge scale-in delay-4">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
          +54 351 555-0123
        </a>
        <div class="logo-frame">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"/><path d="m3 9 2.45-4.9A2 2 0 0 1 7.24 3h9.52a2 2 0 0 1 1.8 1.1L21 9"/><path d="M12 3v6"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="scroll-indicator">
    <div class="mouse"></div>
    <span>Desplázate</span>
  </div>
</section>
</body>
</html>
